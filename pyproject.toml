[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-farm"
version = "0.5.0.13"
description = "A native multi-model autonomous agent desktop app using isolated git worktrees."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=6,<7"]

[project.optional-dependencies]
desktop = []
legacy-web = ["pywebview>=6.2,<7"]
build = ["pyinstaller>=6.10,<7", "pillow>=12,<13"]
test = ["pytest>=8.3,<10", "PyYAML>=6,<7"]

[project.scripts]
agent-farm = "agent_farm.cli:main"
agent-farm-desktop = "agent_farm.desktop:main"

[tool.setuptools.packages.find]
include = ["agent_farm*"]

[tool.setuptools.package-data]
agent_farm = ["web/*.html", "web/*.css", "web/*.js"]
