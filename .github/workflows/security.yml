name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, csharp]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - if: matrix.language == 'csharp'
        run: dotnet build AgentFarm.Desktop/AgentFarm.Desktop.csproj --configuration Debug -p:Platform=x64
      - uses: github/codeql-action/analyze@v4

  dependencies:
    name: Dependency audit
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement packaging/runtime-requirements.txt --strict --vulnerability-service osv --timeout 30
      - name: Audit transitive NuGet dependencies
        shell: powershell
        run: |
          $report = dotnet list AgentFarm.Desktop/AgentFarm.Desktop.csproj package --vulnerable --include-transitive 2>&1
          $report | Write-Host
          if ($report -match '(?m)^\s*>\s+\S+') { throw "Vulnerable NuGet packages were reported." }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
