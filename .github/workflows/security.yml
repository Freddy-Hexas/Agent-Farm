name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, csharp]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - if: matrix.language == 'csharp'
        shell: powershell
        run: >-
          .\scripts\Invoke-CiCommand.ps1
          -Title "CodeQL CSharp build"
          -Executable dotnet
          -Arguments @("build", "AgentFarm.Desktop/AgentFarm.Desktop.csproj", "--configuration", "Debug", "-p:Platform=x64")
      - uses: github/codeql-action/analyze@v4

  dependencies:
    name: Dependency audit
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement packaging/runtime-requirements.txt --strict --vulnerability-service osv --timeout 30
      - name: Audit transitive NuGet dependencies
        shell: powershell
        run: |
          $report = dotnet package list --project AgentFarm.Desktop/AgentFarm.Desktop.csproj --vulnerable --include-transitive --format json 2>&1
          $report | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $escaped = (($report | Select-Object -Last 80) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=NuGet dependency audit::$escaped"
            exit $LASTEXITCODE
          }
          if (($report -join "`n") -match '"vulnerabilities"\s*:') { throw "Vulnerable NuGet packages were reported." }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
