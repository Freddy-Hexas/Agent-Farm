name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Agent Farm and test dependencies
        run: python -m pip install --upgrade pip -e ".[test]"
      - name: Run the complete Python suite
        if: runner.os != 'Windows'
        run: python -X utf8 -m pytest -q tests
      - name: Run the complete Python suite on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          .\scripts\Invoke-CiCommand.ps1
          -Title "Windows Python tests"
          -Executable python
          -Arguments @("-X", "utf8", "-m", "pytest", "-q", "tests")

  native-build:
    name: Native WinUI build and MVVM tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Run platform-neutral MVVM state tests
        run: dotnet run --project AgentFarm.Desktop.StateTests/AgentFarm.Desktop.StateTests.csproj
      - name: Build native WinUI with warnings treated as errors
        shell: powershell
        run: >-
          .\scripts\Invoke-CiCommand.ps1
          -Title "Native WinUI build"
          -Executable dotnet
          -Arguments @("build", "AgentFarm.Desktop/AgentFarm.Desktop.csproj", "--configuration", "Debug", "-p:Platform=x64", "-warnaserror")

  native-ui:
    name: Native WinUI automation
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Install the source backend
        run: python -m pip install -e .
      - name: Enable packaged app development
        shell: powershell
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Install Windows App Development CLI
        uses: microsoft/setup-WinAppCli@v0.1
      - name: Build the native application
        shell: powershell
        run: >-
          .\scripts\Invoke-CiCommand.ps1
          -Title "Native UI WinUI build"
          -Executable dotnet
          -Arguments @("build", "AgentFarm.Desktop/AgentFarm.Desktop.csproj", "--configuration", "Debug", "-p:Platform=x64", "-warnaserror")
      - name: Run the native UI batch
        shell: powershell
        run: >-
          .\scripts\Invoke-CiCommand.ps1
          -Title "Native UI batch"
          -Executable powershell
          -Arguments @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\scripts\test_native_ui_ci.ps1")
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-evidence
          if-no-files-found: warn
          path: |
            test-artifacts/native-ui-tests/**
            ${{ runner.temp }}/AgentFarmDiagnostics/**
